<!DOCTYPE html>
<html>
<head>
    <title>Abdul Rasheed & Sons</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }
        header {
            background: black;
            color: white;
            padding: 15px;
            text-align: center;
        }
        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        nav button {
            margin: 5px;
            padding: 10px;
            color: white;
            background: green;
            border: none;
            cursor: pointer;
        }
        .section {
            display: none;
            padding: 20px;
            text-align: center;
        }
    </style>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</head>

<body>

<header>
    <h1>Abdul Rasheed & Sons</h1>
</header>

<nav>
    <button onclick="showSection('ittar')">Ittar</button>
    <button onclick="showSection('perfumes')">Perfumes</button>
</nav>

<!-- ITTAR MAIN -->
<div id="ittar" class="section">
    <h2>Ittar Category</h2>
    <button onclick="showSection('normal')">Normal</button>
    <button onclick="showSection('premium')">Premium</button>
</div>

<!-- NORMAL ITTAR -->
<div id="normal" class="section">
    <h2>Normal Ittar</h2>
    <p>Add your normal attar products here</p>
</div>

<!-- PREMIUM ITTAR -->
<div id="premium" class="section">
    <h2>Premium Ittar</h2>
    <p>Add your premium attar products here</p>
</div>

<!-- PERFUMES -->
<div id="perfumes" class="section">
    <h2>Perfumes</h2>
    <p>Add your perfume products here</p>
</div>

</body>
</html>
