<!DOCTYPE html>
<html>
<head>
    <title>Abdul Rasheed & Sons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body { font-family: Arial; margin: 0; background: #111; color: white; }

        header { background: black; padding: 20px; text-align: center; font-size: 22px; }

        nav { text-align: center; padding: 10px; background: #222; }

        #searchBox {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            border: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .card {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .btn {
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .orderBtn { background: green; color: white; }
        .cartBtn { background: orange; color: white; }

        #cartBox {
            position: fixed;
            top: 80px;
            right: 10px;
            background: #222;
            padding: 10px;
            width: 200px;
            border-radius: 10px;
        }

        #whatsappFloat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: green;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
        }

        input.qty {
            width: 50px;
        }
    </style>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function orderNow(product) {
            let msg = "Hello, I want to order " + product;
            window.open("https://wa.me/919121486651?text=" + encodeURIComponent(msg));
        }

        function addToCart(product, id) {
            let qty = document.getElementById(id).value;
            cart.push(product + " x" + qty);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        function updateCart() {
            let list = document.getElementById("cartItems");
            list.innerHTML = "";
            cart.forEach((item, i) => {
                list.innerHTML += `<li>${item} <button onclick="removeItem(${i})">❌</button></li>`;
            });
        }

        function removeItem(i) {
            cart.splice(i, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        function sendCart() {
            let msg = "Hello, I want to order: " + cart.join(", ");
            window.open("https://wa.me/919121486651?text=" + encodeURIComponent(msg));
        }

        function searchProducts() {
            let input = document.getElementById("searchBox").value.toLowerCase();
            document.querySelectorAll(".card").forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(input) ? "block" : "none";
            });
        }

        window.onload = function () {
            updateCart();
        };
    </script>
</head>

<body>

<header>Abdul Rasheed & Sons</header>

<nav>
    <input id="searchBox" placeholder="Search products..." onkeyup="searchProducts()">
</nav>

<div id="cartBox">
    <h4>Cart</h4>
    <ul id="cartItems"></ul>
    <button onclick="sendCart()" class="btn orderBtn">Order All</button>
</div>

<div class="grid">

<script>
let products = [
"Dark Chocolate","Body Musk","1 Million Noir","Black Stone","Black Boss",
"Rose Taifi","Balkis","Attar Full","Aseel","Papillion",
"Juzoor Al Oudh","White Oudh","Sandaliya","Sabaya","Ice Cool",
"Black Oudh","Soofiani","Rythum","Janatul Firdous","Mujmua",
"Musk Rose","Amir Al Oudh","Bakhoor"
];

document.write(products.map((p,i)=>`
<div class="card">
${p}<br>
Qty: <input id="q${i}" class="qty" type="number" value="1" min="1"><br>
<button class="btn orderBtn" onclick="orderNow('${p}')">Order</button>
<button class="btn cartBtn" onclick="addToCart('${p}','q${i}')">Add</button>
</div>
`).join(""));
</script>

</div>

<div id="whatsappFloat" onclick="sendCart()">💬</div>

</body>
</html>
