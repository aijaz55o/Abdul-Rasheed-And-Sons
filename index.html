<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Rasheed & Sons</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  background: black;
  letter-spacing: 2px;
}

.banner {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(to right, #111, #222);
}

.banner h1 {
  font-size: 40px;
}

.section {
  padding: 20px;
}

.section h2 {
  border-left: 4px solid gold;
  padding-left: 10px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: #1a1a1a;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

button {
  margin-top: 10px;
  padding: 8px;
  background: gold;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.cart {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: gold;
  padding: 15px;
  border-radius: 50%;
  font-weight: bold;
}

.whatsapp {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: green;
  color: white;
  padding: 15px;
  border-radius: 50%;
}
</style>
</head>

<body>

<header>ABDUL RASHEED & SONS</header>

<div class="banner">
  <h1>Luxury Fragrances</h1>
  <p>Premium Ittars & Perfumes</p>
</div>

<div class="section">
  <h2>Ittar - Normal</h2>
  <div class="products" id="normal"></div>
</div>

<div class="section">
  <h2>Ittar - Premium</h2>
  <div class="products" id="premium"></div>
</div>

<div class="section">
  <h2>Perfumes</h2>
  <div class="products" id="perfumes"></div>
</div>

<div class="cart" onclick="checkout()">🛒</div>
<div class="whatsapp" onclick="checkout()">📲</div>

<script>
let cart = [];

const normal = ["Oudh e Azam","Afrah","Mukhal Al Arab"];
const premium = ["Raqs","Mizan","Habeeba","Mush Al Azhar","Rais Al Hind"];
const perfumes = ["Royal Gold","Black Musk","Desert Oud"];

function displayProducts(list, id) {
  let container = document.getElementById(id);
  list.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <img src="https://via.placeholder.com/150">
        <h4>${item}</h4>
        <button onclick="addToCart('${item}')">Add</button>
      </div>
    `;
  });
}

function addToCart(item) {
  cart.push(item);
  alert(item + " added");
}

function checkout() {
  let message = "Order:\n" + cart.join("\n");
  window.open(`https://wa.me/919121486651?text=${encodeURIComponent(message)}`);
}

displayProducts(normal,"normal");
displayProducts(premium,"premium");
displayProducts(perfumes,"perfumes");
</script>

</body>
</html>
