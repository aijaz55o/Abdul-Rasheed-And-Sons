<!DOCTYPE html>
<html>
<head>
  <title>Abdul Rasheed & Sons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .green { background: green; color: white; }
    .orange { background: orange; color: white; }

    .card {
      background: #111;
      padding: 15px;
      margin: 10px;
      border-radius: 12px;
      display: inline-block;
      width: 40%;
    }

    input {
      width: 50px;
      text-align: center;
    }

    #search {
      width: 80%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin: 10px;
    }

    #whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: green;
      color: white;
      padding: 15px;
      border-radius: 50%;
      font-size: 20px;
    }
  </style>
</head>

<body>

<h1>Abdul Rasheed & Sons</h1>

<input type="text" id="search" placeholder="Search products..." onkeyup="searchProduct()">

<!-- HOME -->
<div id="home">
  <button onclick="showCategory('ittar')">Ittar</button>
  <button onclick="showCategory('perfume')">Perfumes</button>
</div>

<!-- ITTAR -->
<div id="ittar" style="display:none;">
  <h2>Ittar</h2>
  <button onclick="showType('normal')">Normal</button>
  <button onclick="showType('premium')">Premium</button>
  <br><br>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- NORMAL -->
<div id="normal" style="display:none;">

  <!-- LEFT ITEMS -->
  <div class="card">Dark Chocolate<br>
    Qty: <input type="number" value="1" id="q1">
    <br>
    <button class="green" onclick="order('Dark Chocolate','q1')">Order</button>
    <button class="orange" onclick="addToCart('Dark Chocolate','q1')">Add</button>
  </div>

  <div class="card">Black Stone<br>
    Qty: <input type="number" value="1" id="q2">
    <br>
    <button class="green" onclick="order('Black Stone','q2')">Order</button>
    <button class="orange" onclick="addToCart('Black Stone','q2')">Add</button>
  </div>

  <div class="card">Black Boss<br>
    Qty: <input type="number" value="1" id="q3">
    <br>
    <button class="green" onclick="order('Black Boss','q3')">Order</button>
    <button class="orange" onclick="addToCart('Black Boss','q3')">Add</button>
  </div>

  <div class="card">Balkis<br>
    Qty: <input type="number" value="1" id="q4">
    <br>
    <button class="green" onclick="order('Balkis','q4')">Order</button>
    <button class="orange" onclick="addToCart('Balkis','q4')">Add</button>
  </div>

  <div class="card">Aseel<br>
    Qty: <input type="number" value="1" id="q5">
    <br>
    <button class="green" onclick="order('Aseel','q5')">Order</button>
    <button class="orange" onclick="addToCart('Aseel','q5')">Add</button>
  </div>

  <div class="card">Sandalya<br>
    Qty: <input type="number" value="1" id="q6">
    <br>
    <button class="green" onclick="order('Sandalya','q6')">Order</button>
    <button class="orange" onclick="addToCart('Sandalya','q6')">Add</button>
  </div>

  <div class="card">Sabaya<br>
    Qty: <input type="number" value="1" id="q7">
    <br>
    <button class="green" onclick="order('Sabaya','q7')">Order</button>
    <button class="orange" onclick="addToCart('Sabaya','q7')">Add</button>
  </div>

  <br>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- PREMIUM -->
<div id="premium" style="display:none;">

  <div class="card">1 Million Noir<br>
    Qty: <input type="number" value="1" id="q8">
    <br>
    <button class="green" onclick="order('1 Million Noir','q8')">Order</button>
    <button class="orange" onclick="addToCart('1 Million Noir','q8')">Add</button>
  </div>

  <div class="card">Rose Taifi<br>
    Qty: <input type="number" value="1" id="q9">
    <br>
    <button class="green" onclick="order('Rose Taifi','q9')">Order</button>
    <button class="orange" onclick="addToCart('Rose Taifi','q9')">Add</button>
  </div>

  <div class="card">Attar Full<br>
    Qty: <input type="number" value="1" id="q10">
    <br>
    <button class="green" onclick="order('Attar Full','q10')">Order</button>
    <button class="orange" onclick="addToCart('Attar Full','q10')">Add</button>
  </div>

  <div class="card">Papillion<br>
    Qty: <input type="number" value="1" id="q11">
    <br>
    <button class="green" onclick="order('Papillion','q11')">Order</button>
    <button class="orange" onclick="addToCart('Papillion','q11')">Add</button>
  </div>

  <div class="card">Juzoor Al Oudh<br>
    Qty: <input type="number" value="1" id="q12">
    <br>
    <button class="green" onclick="order('Juzoor Al Oudh','q12')">Order</button>
    <button class="orange" onclick="addToCart('Juzoor Al Oudh','q12')">Add</button>
  </div>

  <div class="card">White Oudh<br>
    Qty: <input type="number" value="1" id="q13">
    <br>
    <button class="green" onclick="order('White Oudh','q13')">Order</button>
    <button class="orange" onclick="addToCart('White Oudh','q13')">Add</button>
  </div>

  <br>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- PERFUME -->
<div id="perfume" style="display:none;">
  <h3>Perfumes Coming Soon</h3>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- WHATSAPP -->
<a id="whatsapp" onclick="orderCart()">💬</a>

<script>
let cart = [];

function showCategory(type) {
  document.getElementById("home").style.display = "none";
  document.getElementById(type).style.display = "block";
}

function showType(type) {
  document.getElementById("ittar").style.display = "none";
  document.getElementById(type).style.display = "block";
}

function goBack() {
  location.reload();
}

function order(name, id) {
  let qty = document.getElementById(id).value;
  let msg = `I want to order:\n${name} x ${qty}`;
  window.open(`https://wa.me/919121486651?text=${encodeURIComponent(msg)}`);
}

function addToCart(name, id) {
  let qty = document.getElementById(id).value;
  cart.push(`${name} x ${qty}`);
  alert("Added to cart");
}

function orderCart() {
  if (cart.length === 0) {
    alert("Cart empty");
    return;
  }
  let msg = "I want to order:\n" + cart.join("\n");
  window.open(`https://wa.me/919121486651?text=${encodeURIComponent(msg)}`);
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(input) ? "inline-block" : "none";
  }
}
</script>

</body>
</html>
