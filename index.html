<!DOCTYPE html><html>
<head>
    <title>Abdul Rasheed & Sons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"><style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f5f5f5; }
    header { background: linear-gradient(90deg, black, #333); color: white; padding: 20px; text-align: center; font-size: 24px; }

    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: white; padding: 15px; }
    nav button { padding: 10px 18px; border-radius: 25px; border: none; background: black; color: white; cursor: pointer; }

    #searchBox { padding: 10px; width: 90%; max-width: 400px; border-radius: 25px; border: 1px solid #ccc; }

    .section { display: none; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }

    .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }

    .btn { margin-top: 5px; padding: 6px 10px; border: none; border-radius: 20px; cursor: pointer; }
    .orderBtn { background: green; color: white; }
    .cartBtn { background: orange; color: white; }

    #cartBox { position: fixed; right: 10px; top: 80px; background: white; padding: 10px; width: 220px; border-radius: 10px; }

    #whatsappFloat { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; padding: 15px; border-radius: 50%; cursor: pointer; }

    input.qty { width: 50px; margin-top: 5px; }
</style>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function orderNow(product) {
        let number = "9121486651";
        let message = `Hello, I want to order ${product}`;
        let url = `https://wa.me/91${number}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function addToCart(product, qtyId) {
        let qty = document.getElementById(qtyId).value;
        cart.push(product + " x" + qty);
        saveCart();
    }

    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCart();
    }

    function updateCart() {
        let cartList = document.getElementById('cartItems');
        cartList.innerHTML = '';
        cart.forEach((item, index) => {
            let li = document.createElement('li');
            li.innerHTML = item + " <button onclick='removeItem("+index+")'>❌</button>";
            cartList.appendChild(li);
        });
    }

    function removeItem(index) {
        cart.splice(index,1);
        saveCart();
    }

    function sendCartToWhatsApp() {
        let number = "9121486651";
        let message = "Hello, I want to order: " + cart.join(', ');
        let url = `https://wa.me/91${number}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function searchProducts() {
        let input = document.getElementById('searchBox').value.toLowerCase();
        let cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? 'block' : 'none';
        });
    }

    window.onload = updateCart;
</script>

</head><body><header>Abdul Rasheed & Sons</header><nav>
    <input type="text" id="searchBox" placeholder="Search products..." onkeyup="searchProducts()">
    <button onclick="showSection('ittar')">Ittar</button>
</nav><div id="cartBox">
    <h4>Cart</h4>
    <ul id="cartItems"></ul>
    <button onclick="sendCartToWhatsApp()" class="btn orderBtn">Order All</button>
</div><div id="ittar" class="section">
    <h2>Ittar</h2>
    <button onclick="showSection('normal')">Normal</button>
</div><div id="normal" class="section">
    <h2>Normal Ittar</h2>
    <div class="grid"><div class="card">
        Dark Chocolate<br>
        Qty: <input id="q1" class="qty" type="number" value="1" min="1">
        <button class="btn orderBtn" onclick="orderNow('Dark Chocolate')">Order</button>
        <button class="btn cartBtn" onclick="addToCart('Dark Chocolate','q1')">Add</button>
    </div>

    <div class="card">
        Body Musk<br>
        Qty: <input id="q2" class="qty" type="number" value="1" min="1">
        <button class="btn orderBtn" onclick="orderNow('Body Musk')">Order</button>
        <button class="btn cartBtn" onclick="addToCart('Body Musk','q2')">Add</button>
    </div>

    <div class="card">
        Black Boss<br>
        Qty: <input id="q3" class="qty" type="number" value="1" min="1">
        <button class="btn orderBtn" onclick="orderNow('Black Boss')">Order</button>
        <button class="btn cartBtn" onclick="addToCart('Black Boss','q3')">Add</button>
    </div>

</div>

</div><div id="whatsappFloat" onclick="sendCartToWhatsApp()">💬</div></body>
</html>
