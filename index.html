<!DOCTYPE html>
<html>
<head>
  <title>Abdul Rasheed & Sons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .green { background: green; color: white; }
    .orange { background: orange; color: white; }

    .card {
      background: #111;
      padding: 15px;
      margin: 10px;
      border-radius: 12px;
      display: inline-block;
      width: 40%;
    }

    input {
      width: 50px;
      text-align: center;
    }

    #search {
      width: 80%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin: 10px;
    }

    #whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: green;
      color: white;
      padding: 15px;
      border-radius: 50%;
      font-size: 20px;
    }
  </style>
</head>

<body>

<h1>Abdul Rasheed & Sons</h1>

<input type="text" id="search" placeholder="Search products..." onkeyup="searchProduct()">

<!-- HOME -->
<div id="home">
  <button onclick="showCategory('ittar')">Ittar</button>
  <button onclick="showCategory('perfume')">Perfumes</button>
</div>

<!-- ITTAR -->
<div id="ittar" style="display:none;">
  <h2>Ittar</h2>
  <button onclick="showType('normal')">Normal</button>
  <button onclick="showType('premium')">Premium</button>
  <br><br>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- NORMAL ITTAR -->
<div id="normal" style="display:none;">

  <div class="card">Dark Chocolate <br>
    Qty: <input type="number" value="1" id="q1">
    <br>
    <button class="green" onclick="order('Dark Chocolate', 'q1')">Order</button>
    <button class="orange" onclick="addToCart('Dark Chocolate', 'q1')">Add</button>
  </div>

  <div class="card">1 Million Noir <br>
    Qty: <input type="number" value="1" id="q2">
    <br>
    <button class="green" onclick="order('1 Million Noir', 'q2')">Order</button>
    <button class="orange" onclick="addToCart('1 Million Noir', 'q2')">Add</button>
  </div>

  <div class="card">Black Stone <br>
    Qty: <input type="number" value="1" id="q3">
    <br>
    <button class="green" onclick="order('Black Stone', 'q3')">Order</button>
    <button class="orange" onclick="addToCart('Black Stone', 'q3')">Add</button>
  </div>

  <div class="card">Rose Taifi <br>
    Qty: <input type="number" value="1" id="q4">
    <br>
    <button class="green" onclick="order('Rose Taifi', 'q4')">Order</button>
    <button class="orange" onclick="addToCart('Rose Taifi', 'q4')">Add</button>
  </div>

  <br>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- PREMIUM -->
<div id="premium" style="display:none;">
  <h3>Premium Coming Soon</h3>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- PERFUMES -->
<div id="perfume" style="display:none;">
  <h3>Perfumes Coming Soon</h3>
  <button onclick="goBack()">⬅ Back</button>
</div>

<!-- WHATSAPP BUTTON -->
<a id="whatsapp" onclick="orderCart()">💬</a>

<script>
let cart = [];

function showCategory(type) {
  document.getElementById("home").style.display = "none";
  document.getElementById(type).style.display = "block";
}

function showType(type) {
  document.getElementById("ittar").style.display = "none";
  document.getElementById(type).style.display = "block";
}

function goBack() {
  location.reload();
}

function order(name, qtyId) {
  let qty = document.getElementById(qtyId).value;
  let msg = `I want to order:\n${name} x ${qty}`;
  window.open(`https://wa.me/919121486651?text=${encodeURIComponent(msg)}`);
}

function addToCart(name, qtyId) {
  let qty = document.getElementById(qtyId).value;
  cart.push(`${name} x ${qty}`);
  alert("Added to cart");
}

function orderCart() {
  if (cart.length === 0) {
    alert("Cart is empty");
    return;
  }

  let msg = "I want to order:\n" + cart.join("\n");
  window.open(`https://wa.me/919121486651?text=${encodeURIComponent(msg)}`);
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(input) ? "inline-block" : "none";
  }
}
</script>

</body>
</html>
