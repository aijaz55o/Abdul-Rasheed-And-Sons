<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Rasheed & Sons</title>

<style>
body {margin:0;font-family:Poppins;background:#0a0a0a;color:white;}
header {padding:15px;text-align:center;background:black;font-size:22px;}
.search input {width:90%;padding:10px;margin:10px;border-radius:20px;border:none;}
.section {padding:20px;}
.products {display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px;}
.card {background:#1a1a1a;padding:10px;border-radius:12px;}
.card img {width:100%;border-radius:10px;}
.price {color:gold;}
button {margin-top:5px;padding:6px;border:none;border-radius:5px;cursor:pointer;}
.add {background:gold;}
.buy {background:green;color:white;}
.cartBtn,.waBtn {position:fixed;right:20px;padding:15px;border-radius:50%;}
.cartBtn {bottom:20px;background:gold;}
.waBtn {bottom:80px;background:green;color:white;}
.popup {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;}
.popupBox {background:#111;padding:20px;border-radius:10px;width:80%;}
</style>
</head>

<body>

<header>ABDUL RASHEED & SONS</header>

<div class="search">
<input placeholder="Search..." onkeyup="search(this.value)">
</div>

<div class="section">
<h2>Ittar - Normal</h2>
<div class="products" id="normal"></div>
</div>

<div class="section">
<h2>Ittar - Premium</h2>
<div class="products" id="premium"></div>
</div>

<div class="section">
<h2>Perfumes</h2>
<div class="products" id="perfumes"></div>
</div>

<div class="cartBtn" onclick="openCart()">🛒</div>
<div class="waBtn" onclick="checkout()">📲</div>

<div class="popup" id="popup">
  <div class="popupBox" id="popupBox"></div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

const products = {
  normal:[
    {name:"Oudh e Azam",price:200,img:"https://via.placeholder.com/150"},
    {name:"Afrah",price:180,img:"https://via.placeholder.com/150"},
    {name:"Mukhal Al Arab",price:220,img:"https://via.placeholder.com/150"}
  ],
  premium:[
    {name:"Raqs",price:400,img:"https://via.placeholder.com/150"},
    {name:"Mizan",price:450,img:"https://via.placeholder.com/150"},
    {name:"Habeeba",price:500,img:"https://via.placeholder.com/150"},
    {name:"Mush Al Azhar",price:550,img:"https://via.placeholder.com/150"},
    {name:"Rais Al Hind",price:600,img:"https://via.placeholder.com/150"}
  ],
  perfumes:[
    {name:"Royal Gold",price:700,img:"https://via.placeholder.com/150"},
    {name:"Black Musk",price:650,img:"https://via.placeholder.com/150"},
    {name:"Desert Oud",price:750,img:"https://via.placeholder.com/150"}
  ]
};

function show(id,list){
  let box=document.getElementById(id);
  box.innerHTML="";
  list.forEach(p=>{
    box.innerHTML+=`
    <div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <div class="price">₹${p.price}</div>
      <input type="number" min="1" value="1" id="${p.name}">
      <button class="add" onclick="add('${p.name}',${p.price})">Add</button>
      <button class="buy" onclick="buyNow('${p.name}',${p.price})">Buy</button>
    </div>`;
  });
}

function add(name,price){
  let qty = parseInt(document.getElementById(name).value) || 1;
  if(!name || !price) return;

  if(cart[name]) cart[name].qty += qty;
  else cart[name] = {price:price, qty:qty};

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added ✅");
}

function buyNow(name,price){
  let qty = parseInt(document.getElementById(name).value) || 1;
  let total = price * qty;
  let msg = `🛍️ Order:%0A${name} x${qty} = ₹${total}`;
  window.open("https://wa.me/919121486651?text=" + msg);
}

function openCart(){
  let html="<h3>Your Cart</h3>";
  let total=0;

  for(let i in cart){
    let item = cart[i];
    if(!item || !item.qty) continue;

    let subtotal = item.price * item.qty;
    total += subtotal;

    html += `
    <div>
      ${i} x${item.qty} = ₹${subtotal}
      <button onclick="removeItem('${i}')">❌</button>
    </div>`;
  }

  html += `<hr>Total: ₹${total}<br><br>
  <button onclick="checkout()">Order Now</button>
  <button onclick="clearCart()">Clear Cart</button>`;

  document.getElementById("popupBox").innerHTML = html;
  document.getElementById("popup").style.display="flex";
}

function removeItem(name){
  delete cart[name];
  localStorage.setItem("cart", JSON.stringify(cart));
  openCart();
}

function clearCart(){
  cart = {};
  localStorage.removeItem("cart");
  openCart();
}

function checkout(){
  let msg="🛍️ *Order Details*%0A";
  let total=0;

  for(let i in cart){
    let item = cart[i];
    if(!item || !item.qty) continue;

    let subtotal = item.price * item.qty;
    total += subtotal;

    msg += `${i} x${item.qty} = ₹${subtotal}%0A`;
  }

  msg += `%0A💰 Total: ₹${total}`;

  window.open("https://wa.me/919121486651?text=" + msg);
}

function search(val){
  val = val.toLowerCase();
  for(let k in products){
    let f = products[k].filter(p=>p.name.toLowerCase().includes(val));
    show(k,f);
  }
}

document.getElementById("popup").onclick = () => popup.style.display="none";

show("normal",products.normal);
show("premium",products.premium);
show("perfumes",products.perfumes);
</script>

</body>
</html>
