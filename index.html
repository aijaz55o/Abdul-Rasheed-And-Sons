<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Rasheed & Sons</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0b0b0b;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: black;
  font-size: 22px;
  letter-spacing: 2px;
}

.search {
  padding: 10px;
  text-align: center;
}

.search input {
  width: 80%;
  padding: 10px;
  border-radius: 25px;
  border: none;
}

.section {
  padding: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

.card {
  background: #1a1a1a;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: gold;
  margin: 5px 0;
}

.qty {
  width: 50px;
}

button {
  background: gold;
  border: none;
  padding: 6px;
  margin-top: 5px;
  border-radius: 5px;
}

.cartBtn, .waBtn {
  position: fixed;
  right: 20px;
  padding: 15px;
  border-radius: 50%;
}

.cartBtn { bottom: 20px; background: gold; }
.waBtn { bottom: 80px; background: green; color: white; }
</style>
</head>

<body>

<header>ABDUL RASHEED & SONS</header>

<div class="search">
  <input type="text" placeholder="Search..." onkeyup="searchProducts(this.value)">
</div>

<div class="section">
  <h2>Ittar - Normal</h2>
  <div class="products" id="normal"></div>
</div>

<div class="section">
  <h2>Ittar - Premium</h2>
  <div class="products" id="premium"></div>
</div>

<div class="section">
  <h2>Perfumes</h2>
  <div class="products" id="perfumes"></div>
</div>

<div class="cartBtn" onclick="checkout()">🛒</div>
<div class="waBtn" onclick="checkout()">📲</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

const products = {
  normal: [
    {name:"Oudh e Azam", price:200},
    {name:"Afrah", price:180},
    {name:"Mukhal Al Arab", price:220}
  ],
  premium: [
    {name:"Raqs", price:400},
    {name:"Mizan", price:450},
    {name:"Habeeba", price:500},
    {name:"Mush Al Azhar", price:550},
    {name:"Rais Al Hind", price:600}
  ],
  perfumes: [
    {name:"Royal Gold", price:700},
    {name:"Black Musk", price:650},
    {name:"Desert Oud", price:750}
  ]
};

function display(id, list) {
  let box = document.getElementById(id);
  box.innerHTML = "";
  list.forEach(p => {
    box.innerHTML += `
    <div class="card">
      <img src="https://via.placeholder.com/150">
      <h4>${p.name}</h4>
      <div class="price">₹${p.price}</div>
      <input type="number" min="1" value="1" class="qty" id="${p.name}">
      <button onclick="add('${p.name}', ${p.price})">Add</button>
    </div>`;
  });
}

function add(name, price) {
  let qty = document.getElementById(name).value;
  if(cart[name]) cart[name].qty += parseInt(qty);
  else cart[name] = {price, qty: parseInt(qty)};
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart");
}

function checkout() {
  let msg = "Order:%0A";
  for(let item in cart) {
    msg += item + " x" + cart[item].qty + "%0A";
  }
  window.open("https://wa.me/919121486651?text=" + msg);
}

function searchProducts(val) {
  val = val.toLowerCase();
  for(let key in products) {
    let filtered = products[key].filter(p => p.name.toLowerCase().includes(val));
    display(key, filtered);
  }
}

display("normal", products.normal);
display("premium", products.premium);
display("perfumes", products.perfumes);
</script>

</body>
</html>
